name: diag-nearby
on:
  push:
    branches: [diag/nearby]
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: fix/nearby-photon }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Real search with the app's code
        run: |
          cat > t.mjs <<'JS'
          import { fetchPlaces, nearestByChain } from './src/lib/nearby.js';
          for (const [label, here] of [['Nashville', { lat: 36.1627, lon: -86.7816 }], ['Chicago Loop', { lat: 41.8781, lon: -87.6298 }]]) {
            let t = Date.now();
            const places = await fetchPlaces(here);
            console.log(label, 'photon', Date.now() - t, 'ms', places.length, 'places');
            for (const [c, p] of Object.entries(nearestByChain(places))) console.log(' ', c, p.miles.toFixed(2), 'mi', p.address, p.zip);
          }
          // Force the Nominatim backup.
          const t = Date.now();
          const viaNominatim = await fetchPlaces({ lat: 36.1627, lon: -86.7816 }, { fetchImpl: (u, o) => (u.includes('photon') ? Promise.resolve({ ok: false, status: 503 }) : fetch(u, { ...o, headers: { 'User-Agent': 'FoodForBudget/1.0 (https://food-for-budget.vercel.app)' } })) });
          console.log('nominatim backup', Date.now() - t, 'ms', viaNominatim.length, 'places', Object.keys(nearestByChain(viaNominatim)));
          JS
          node t.mjs

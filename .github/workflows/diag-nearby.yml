name: diag-nearby
on:
  push:
    branches: [diag/nearby]
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: fix/nearby-photon }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Real search with the app's code
        run: |
          cat > t.mjs <<'JS'
          import { fetchPlaces, nearestByChain } from './src/lib/nearby.js';
          const log = (u, o) => fetch(u, o).then(async (r) => { console.log('   ', new URL(u).host, new URL(u).searchParams.get('q'), r.status, r.status !== 200 ? (await r.clone().text()).slice(0, 200) : ''); return r; });
          const pause = (ms) => new Promise((r) => setTimeout(r, ms));
          for (const [label, here, wait] of [['Chicago first', { lat: 41.8781, lon: -87.6298 }, 0], ['Nashville right after', { lat: 36.1627, lon: -86.7816 }, 0], ['Austin after 5 s', { lat: 30.2672, lon: -97.7431 }, 5000], ['Rural Kansas', { lat: 38.5, lon: -98.5 }, 2000]]) {
            await pause(wait);
            const t = Date.now();
            try {
              const places = await fetchPlaces(here, { fetchImpl: log });
              console.log(label, Date.now() - t, 'ms', places.length, 'places');
              for (const [c, p] of Object.entries(nearestByChain(places))) console.log('  ', c, p.miles.toFixed(2), 'mi', p.address, p.zip);
            } catch (e) { console.log(label, 'FAILED', e.message); }
          }
          JS
          node t.mjs

name: diag-nearby
on:
  push:
    branches: [diag/nearby]
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Photon (komoot)
        run: |
          for q in "McDonald's" "Taco Bell" "Chipotle" "Panera Bread"; do
            echo "== photon $q"
            curl -sS -m 30 -G -o out.json -w "status %{http_code} time %{time_total}\n" -H "Origin: https://food-for-budget.vercel.app" -D h.txt \
              --data-urlencode "q=$q" --data-urlencode "lat=36.16" --data-urlencode "lon=-86.78" --data-urlencode "limit=15" \
              --data-urlencode "bbox=-86.93,36.06,-86.63,36.26" https://photon.komoot.io/api/ || true
            grep -i "access-control" h.txt || echo "no CORS header"
            python3 -c "import json;d=json.load(open('out.json'));print(len(d.get('features',[])));[print(f['properties'].get('name'),f['properties'].get('osm_key'),f['properties'].get('osm_value'),f['properties'].get('street'),f['geometry']['coordinates']) for f in d.get('features',[])[:6]]" || head -c 300 out.json
          done
      - name: Nominatim
        run: |
          echo "== nominatim"
          curl -sS -m 30 -G -o out.json -w "status %{http_code} time %{time_total}\n" -A "FoodForBudget/1.0 (https://food-for-budget.vercel.app)" -H "Origin: https://food-for-budget.vercel.app" -D h.txt \
            --data-urlencode "q=Chipotle" --data-urlencode "format=jsonv2" --data-urlencode "limit=20" --data-urlencode "viewbox=-86.93,36.26,-86.63,36.06" --data-urlencode "bounded=1" --data-urlencode "extratags=1" https://nominatim.openstreetmap.org/search || true
          grep -i "access-control" h.txt || echo "no CORS header"
          python3 -c "import json;d=json.load(open('out.json'));print(len(d));[print(x['name'],x.get('type'),x['lat'],x['lon'],(x.get('extratags') or {}).get('brand:wikidata')) for x in d[:6]]" || head -c 300 out.json
      - name: Overpass header variants
        run: |
          Q='[out:json][timeout:20];nwr["brand:wikidata"="Q465751"](around:5000,36.16,-86.78);out center tags;'
          for ua in "FoodForBudget/1.0 (contact: atioluwanimofe@gmail.com)" "food-for-budget"; do
            echo "== overpass-api.de UA=$ua"
            curl -sS -m 30 -o out.txt -w "status %{http_code}\n" -A "$ua" -H "Accept: application/json" --data-urlencode "data=$Q" https://overpass-api.de/api/interpreter || true
            head -c 200 out.txt; echo
          done
          for u in https://overpass.kumi.systems/api/interpreter https://overpass.osm.ch/api/interpreter; do
            echo "== $u"
            curl -sS -m 30 -o out.txt -w "status %{http_code} time %{time_total}\n" -A "FoodForBudget/1.0" --data-urlencode "data=$Q" "$u" || true
            head -c 200 out.txt; echo
          done
